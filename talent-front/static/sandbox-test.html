<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; }

.sidebar { width: 280px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; gap: 16px; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
.sidebar h1 { font-size: 18px; font-weight: 600; color: #38bdf8; }
.sidebar label { font-size: 12px; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
.sidebar select, .sidebar input, .sidebar textarea { width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 13px; outline: none; transition: border-color 0.15s; }
.sidebar select:focus, .sidebar input:focus, .sidebar textarea:focus { border-color: #38bdf8; }
.sidebar .field { display: flex; flex-direction: column; gap: 4px; }
.sidebar .row { display: flex; gap: 8px; }
.sidebar .row .field { flex: 1; }
.sidebar textarea { resize: vertical; min-height: 60px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
.sidebar .section-title { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; padding-top: 12px; border-top: 1px solid #334155; }

.main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.main h2 { font-size: 14px; font-weight: 500; color: #94a3b8; margin-bottom: 4px; }

.code-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.code-area textarea { flex: 1; width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; padding: 16px; resize: none; outline: none; line-height: 1.5; tab-size: 4; }
.code-area textarea:focus { border-color: #38bdf8; }

.actions { display: flex; gap: 8px; align-items: center; }
.btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: #38bdf8; color: #0f172a; }
.btn-primary:hover { background: #7dd3fc; }
.btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #f87171; }
.btn-secondary { background: #334155; color: #e2e8f0; }
.btn-secondary:hover { background: #475569; }
.status { font-size: 13px; color: #94a3b8; }
.status.running { color: #fbbf24; }
.status.done { color: #22d3ee; }
.status.error { color: #ef4444; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; flex: 0 0 auto; }
.panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.panel-header { padding: 10px 14px; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #334155; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
.panel-body { padding: 14px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.5; overflow: auto; white-space: pre-wrap; word-break: break-all; max-height: 300px; min-height: 80px; background: #0f172a; flex: 1; }

.meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.meta-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; text-align: center; }
.meta-card .value { font-size: 24px; font-weight: 700; }
.meta-card .label { font-size: 11px; color: #64748b; margin-top: 2px; }
.meta-card .value.green { color: #22d3ee; }
.meta-card .value.yellow { color: #fbbf24; }
.meta-card .value.red { color: #ef4444; }
.meta-card .value.blue { color: #38bdf8; }

.hidden { display: none !important; }

/* Framework files editor */
.file-list { display: flex; flex-direction: column; gap: 6px; }
.file-row { display: flex; gap: 6px; align-items: center; }
.file-row input { flex: 1; }
.file-row .btn-remove { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 2px 6px; }
.btn-add-file { margin-top: 4px; }

@media (max-width: 900px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 12px; }
  .sidebar .field { min-width: 120px; flex: 1; }
  .sidebar .section-title { display: none; }
  .panels { grid-template-columns: 1fr; }
  .meta-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="sidebar">
  <h1>☰ Sandbox Test</h1>

  <div class="field">
    <label>Language</label>
    <select id="language">
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
      <option value="go">Go</option>
      <option value="java">Java</option>
      <option value="cpp">C++</option>
      <option value="c">C</option>
      <option value="rust">Rust</option>
      <option value="ruby">Ruby</option>
      <option value="typescript">TypeScript</option>
    </select>
  </div>

  <div class="field">
    <label>Execution Type</label>
    <select id="exec-type">
      <option value="standard">Standard (stdin/stdout)</option>
      <option value="function">Function (test runner)</option>
      <option value="framework">Framework (project)</option>
    </select>
  </div>

  <div class="field hidden" id="stdin-field">
    <label>Stdin Input</label>
    <textarea id="stdin" placeholder="Input data..."></textarea>
  </div>

  <div class="field hidden" id="testcase-field">
    <label>Test Cases (JSON array)</label>
    <textarea id="testcases" placeholder='[{"func": "add", "args": [1,2], "expected": 3}]'></textarea>
  </div>

  <div class="section-title">Resource Limits</div>
  <div class="row">
    <div class="field">
      <label>Time Limit (s)</label>
      <input type="number" id="time-limit" value="10" min="1" max="60">
    </div>
    <div class="field">
      <label>Memory Limit (MB)</label>
      <input type="number" id="mem-limit" value="256" min="64" max="1024">
    </div>
  </div>

  <div class="section-title hidden" id="fw-section">Framework Options</div>
  <div class="field hidden" id="template-field">
    <label>Template ID</label>
    <input type="text" id="template-id" placeholder="react / express / django">
  </div>

  <div class="field hidden" id="files-field">
    <label>Files to inject</label>
    <div class="file-list" id="file-list">
      <div class="file-row">
        <input type="text" class="file-path" placeholder="src/App.jsx">
        <input type="text" class="file-content" placeholder="File content...">
        <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
      </div>
    </div>
    <button class="btn btn-secondary btn-add-file" onclick="addFileRow()">+ Add File</button>
  </div>

  <div class="field">
    <label>API Base URL</label>
    <input type="text" id="api-url" value="http://localhost:5000/api/v1">
  </div>
</div>

<div class="main">
  <div class="code-area">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <h2>Code</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="loadSample()">Load Sample</button>
        <button class="btn btn-secondary" onclick="clearCode()">Clear</button>
      </div>
    </div>
    <textarea id="code" spellcheck="false" placeholder="Write your code here..."></textarea>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="run-btn" onclick="runCode()">▶ Run</button>
    <button class="btn btn-danger hidden" id="cancel-btn" onclick="cancelRun()">■ Cancel</button>
    <span class="status" id="status"></span>
  </div>

  <div class="meta-grid" id="meta-grid">
    <div class="meta-card"><div class="value blue" id="meta-status">—</div><div class="label">Status</div></div>
    <div class="meta-card"><div class="value" id="meta-exit">—</div><div class="label">Exit Code</div></div>
    <div class="meta-card"><div class="value" id="meta-time">—</div><div class="label">Time (ms)</div></div>
    <div class="meta-card"><div class="value" id="meta-passed">—</div><div class="label">Passed</div></div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">stdout</div>
      <div class="panel-body" id="stdout-output"></div>
    </div>
    <div class="panel">
      <div class="panel-header">stderr</div>
      <div class="panel-body" id="stderr-output"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Raw Response</div>
    <div class="panel-body" id="raw-output" style="max-height:150px;font-size:12px;color:#94a3b8;"></div>
  </div>
</div>

<script>
const API_URL = document.getElementById('api-url');
const LANG = document.getElementById('language');
const TYPE = document.getElementById('exec-type');
const CODE = document.getElementById('code');
const STDIN = document.getElementById('stdin');
const TESTCASES = document.getElementById('testcases');
const TIME_LIMIT = document.getElementById('time-limit');
const MEM_LIMIT = document.getElementById('mem-limit');
const TEMPLATE_ID = document.getElementById('template-id');
const STATUS = document.getElementById('status');
const RUN_BTN = document.getElementById('run-btn');
const CANCEL_BTN = document.getElementById('cancel-btn');

let currentAbort = null;

// Show/hide fields based on execution type
TYPE.addEventListener('change', () => {
  const t = TYPE.value;
  document.getElementById('stdin-field').classList.toggle('hidden', t !== 'standard');
  document.getElementById('testcase-field').classList.toggle('hidden', t !== 'function');
  document.getElementById('fw-section').classList.toggle('hidden', t !== 'framework');
  document.getElementById('template-field').classList.toggle('hidden', t !== 'framework');
  document.getElementById('files-field').classList.toggle('hidden', t !== 'framework');
});
TYPE.dispatchEvent(new Event('change'));

function addFileRow() {
  const list = document.getElementById('file-list');
  const row = document.createElement('div');
  row.className = 'file-row';
  row.innerHTML = `
    <input type="text" class="file-path" placeholder="path/to/file.js">
    <input type="text" class="file-content" placeholder="Content...">
    <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
  `;
  list.appendChild(row);
}

function clearCode() {
  CODE.value = '';
  document.getElementById('stdout-output').textContent = '';
  document.getElementById('stderr-output').textContent = '';
  document.getElementById('raw-output').textContent = '';
  document.getElementById('meta-status').textContent = '—';
  document.getElementById('meta-exit').textContent = '—';
  document.getElementById('meta-time').textContent = '—';
  document.getElementById('meta-passed').textContent = '—';
  STATUS.textContent = '';
}

function cancelRun() {
  if (currentAbort) {
    currentAbort.abort();
    currentAbort = null;
  }
}

function setRunning(running) {
  RUN_BTN.disabled = running;
  RUN_BTN.classList.toggle('hidden', running);
  CANCEL_BTN.classList.toggle('hidden', !running);
  STATUS.textContent = running ? 'Running...' : '';
  STATUS.className = running ? 'status running' : 'status';
}

function loadSample() {
  const lang = LANG.value;
  const type = TYPE.value;

  const samples = {
    'python:standard': `print("Hello, World!")
name = input()
print(f"Hello, {name}!")`,
    'python:function': `def add(a, b):
    return a + b

def is_even(n):
    return n % 2 == 0`,
    'python:framework': `# This file will be injected into the framework template
def handler(request):
    return {"message": "Hello from Python!"}`,
    'javascript:standard': `const readline = require('readline');
const rl = readline.createInterface({
  input: process.stdin,
  output: process.stdout
});
console.log("Hello, World!");
rl.on('line', (line) => {
  console.log("Hello, " + line + "!");
  rl.close();
});`,
    'javascript:function': `function add(a, b) {
  return a + b;
}

function isEven(n) {
  return n % 2 === 0;
}

module.exports = { add, isEven };`,
    'go:standard': `package main

import "fmt"

func main() {
    fmt.Println("Hello, World!")
    var name string
    fmt.Scan(&name)
    fmt.Printf("Hello, %s!\\n", name)
}`,
    'go:function': `package main

func add(a, b int) int {
    return a + b
}

func isEven(n int) bool {
    return n % 2 == 0
}`,
    'rust:standard': `fn main() {
    println!("Hello, World!");
    let mut input = String::new();
    std::io::stdin().read_line(&mut input).unwrap();
    println!("Hello, {}!", input.trim());
}`,
    'cpp:standard': `#include <iostream>
#include <string>
using namespace std;

int main() {
    string name;
    cout << "Hello, World!" << endl;
    getline(cin, name);
    cout << "Hello, " << name << "!" << endl;
    return 0;
}`,
    'ruby:standard': `puts "Hello, World!"
name = gets.chomp
puts "Hello, #{name}!"`,
    'typescript:standard': `const readline = require('readline');
const rl = readline.createInterface({
  input: process.stdin,
  output: process.stdout
});
console.log("Hello, World!");
rl.on('line', (line: string) => {
  console.log("Hello, " + line + "!");
  rl.close();
});`,
  };

  const key = `${lang}:${type}`;
  if (samples[key]) {
    CODE.value = samples[key];
  } else {
    const fallback = samples[`${lang}:standard`] || '// Write your code here';
    CODE.value = fallback;
  }

  if (type === 'standard') {
    if (lang === 'python') STDIN.value = 'Alice';
    else STDIN.value = 'Bob';
  }
  if (type === 'function') {
    TESTCASES.value = JSON.stringify([
      { "func": "add", "args": [1, 2], "expected": 3 },
      { "func": "add", "args": [-1, 1], "expected": 0 },
      { "func": "add", "args": [0, 0], "expected": 0 }
    ], null, 2);
  }
}

async function runCode() {
  clearCode();

  const files = {};
  if (TYPE.value === 'framework') {
    document.querySelectorAll('.file-row').forEach(row => {
      const path = row.querySelector('.file-path').value.trim();
      const content = row.querySelector('.file-content').value;
      if (path) files[path] = content;
    });
  }

  const body = {
    language: LANG.value,
    code: CODE.value,
    type: TYPE.value,
    stdin: STDIN.value || '',
    time_limit: parseInt(TIME_LIMIT.value) || 10,
    memory_limit: parseInt(MEM_LIMIT.value) || 256,
  };

  if (TYPE.value === 'function') {
    body.stdin = TESTCASES.value || '';
  }
  if (TYPE.value === 'framework') {
    body.template_id = TEMPLATE_ID.value || 'default';
    body.files = files;
  }

  currentAbort = new AbortController();
  setRunning(true);

  try {
    const res = await fetch(API_URL.value + '/sandbox/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: currentAbort.signal,
    });

    const data = await res.json();

    document.getElementById('stdout-output').textContent = data.stdout || '(empty)';
    document.getElementById('stderr-output').textContent = data.stderr || '(empty)';
    document.getElementById('raw-output').textContent = JSON.stringify(data, null, 2);

    document.getElementById('meta-exit').textContent = data.exitCode ?? '—';
    document.getElementById('meta-time').textContent = data.timeMs ?? '—';

    if (data.passed === true) {
      document.getElementById('meta-passed').textContent = '✓';
      document.getElementById('meta-passed').className = 'value green';
    } else if (data.passed === false) {
      document.getElementById('meta-passed').textContent = '✗';
      document.getElementById('meta-passed').className = 'value red';
    } else {
      document.getElementById('meta-passed').textContent = exitCode === 0 ? '✓' : '✗';
    }

    const exitCode = data.exitCode ?? -1;
    let statusText = 'ERROR';
    let statusClass = 'red';
    if (data.error === 'timeout') {
      statusText = 'TIME_LIMIT';
      statusClass = 'yellow';
    } else if (exitCode === 0 && data.passed !== false) {
      statusText = 'ACCEPTED';
      statusClass = 'green';
    } else if (exitCode !== 0) {
      statusText = 'RUNTIME_ERROR';
      statusClass = 'red';
    } else if (data.passed === false) {
      statusText = 'WRONG_ANSWER';
      statusClass = 'red';
    }

    document.getElementById('meta-status').textContent = statusText;
    document.getElementById('meta-status').className = 'value ' + statusClass;

    if (data.error && data.error !== 'timeout') {
      STATUS.textContent = 'Error: ' + data.error;
      STATUS.className = 'status error';
    } else {
      STATUS.textContent = 'Done (' + statusText + ')';
      STATUS.className = 'status done';
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      STATUS.textContent = 'Cancelled';
      STATUS.className = 'status error';
    } else {
      document.getElementById('raw-output').textContent = 'Request failed: ' + err.message;
      STATUS.textContent = 'Error: ' + err.message;
      STATUS.className = 'status error';
    }
  } finally {
    setRunning(false);
    currentAbort = null;
  }
}
</script>
</body>
</html>
